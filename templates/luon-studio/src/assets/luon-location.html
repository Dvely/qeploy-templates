<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루온 스튜디오 · 예시 지도</title><style>*{box-sizing:border-box}body{margin:0;background:#eee9df;font:13px Arial,sans-serif;color:#35332e;overflow:hidden}svg{width:100vw;height:100vh;touch-action:none;cursor:grab}button{border:1px solid #ddd;background:white;width:34px;height:34px;font-size:22px;color:#333;cursor:pointer}.controls{position:absolute;right:14px;top:14px;display:grid}.note{position:absolute;bottom:10px;left:14px;background:#ffffffda;padding:7px 10px;border-radius:5px;font-size:11px}.pin{filter:drop-shadow(0 3px 4px #3333)}</style><svg viewBox="0 0 800 450" aria-label="가상 브랜드의 예시 지도"><g id="scene"><rect width="800" height="450" fill="#edeae2"/><path d="M0 325q180-110 390-20t410-5v150H0" fill="#bdd7cd"/><g fill="#ddd9cd"><rect x="60" y="40" width="130" height="65" rx="4"/><rect x="60" y="135" width="130" height="85" rx="4"/><rect x="260" y="40" width="160" height="70" rx="4"/><rect x="260" y="150" width="170" height="70" rx="4"/><rect x="500" y="40" width="120" height="70" rx="4"/><rect x="670" y="55" width="120" height="155" rx="4"/><rect x="495" y="150" width="135" height="95" rx="4"/></g><g stroke="#fff" stroke-width="23" fill="none"><path d="M-30 120h880M225-50v500M465-50v500M645-50v500M-10 260h830"/></g><g stroke="#d4b59e" stroke-width="2" fill="none"><path d="M-30 120h880M225-50v500M465-50v500M645-50v500M-10 260h830"/></g><path d="M225 390V260h240V120h85" stroke="#d97757" stroke-width="5" stroke-dasharray="8 5" fill="none"/><g class="pin" transform="translate(460 130)"><path d="M0-32a25 25 0 1 1 0 50L0 34-16 13A25 25 0 0 1 0-32" fill="#d97757"/><circle cy="-7" r="8" fill="white"/></g><g fill="#666" font-size="14"><text x="100" y="85">모먼트 파크</text><text x="292" y="85">루온 크리에이티브 랩</text><text x="510" y="205">스튜디오로</text><text x="270" y="375">루온역 1번 출구</text><text x="680" y="90">컬처 라운지</text></g><g transform="translate(335 175)"><rect width="225" height="48" rx="10" fill="white"/><text x="18" y="28" font-weight="700" fill="#262524">LUON STUDIO · 가상 위치</text></g></g></svg><div class="controls"><button aria-label="지도 확대">+</button><button aria-label="지도 축소">−</button></div><p class="note">가상 위치 안내 · 드래그하거나 확대해서 살펴보세요.</p><script>let z=1,x=0,y=0,drag=null;const s=document.querySelector('#scene'),v=document.querySelector('svg');function draw(){s.setAttribute('transform',`translate(${x} ${y}) translate(400 225) scale(${z}) translate(-400 -225)`)}document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{z=Math.max(.7,Math.min(2.5,z+(i?-.2:.2)));draw()});v.onpointerdown=e=>{drag=[e.clientX,e.clientY,x,y];v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(drag){x=drag[2]+(e.clientX-drag[0])*800/v.clientWidth;y=drag[3]+(e.clientY-drag[1])*450/v.clientHeight;draw()}};v.onpointerup=()=>drag=null;</script></html>
