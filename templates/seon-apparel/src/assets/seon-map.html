<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세온 스튜디오 가상 위치</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px Arial,sans-serif;background:#f0eee5}svg{width:100%;height:100%;touch-action:none;cursor:grab}.caption{position:absolute;bottom:12px;left:12px;background:#fffc;padding:8px 12px;border-radius:8px;font-size:11px;color:#555}.tools{position:absolute;right:15px;bottom:15px;display:grid;gap:3px}button{width:35px;height:35px;background:white;border:1px solid #ddd;border-radius:5px;font-size:20px;cursor:pointer}</style><svg viewBox="0 0 1100 600" role="img" aria-label="세온 스튜디오의 가상 위치를 표현한 지도"><defs><pattern id="blocks" width="180" height="130" patternUnits="userSpaceOnUse"><rect x="14" y="14" width="140" height="92" rx="8" fill="#e3e1d9" stroke="#d6d5cd"/><rect x="35" y="35" width="42" height="45" rx="3" fill="#d3d1c5"/><rect x="86" y="30" width="46" height="58" rx="3" fill="#d9d6cc"/></pattern></defs><g id="world"><rect x="-1000" y="-1000" width="3100" height="2600" fill="url(#blocks)"/><path d="M-10 150Q350 70 500 300T1110 440" fill="none" stroke="#b5d7de" stroke-width="70"/><path d="M-10 150Q350 70 500 300T1110 440" fill="none" stroke="#c8e7ed" stroke-width="48"/><path d="M50 330H1060M690 -30V650" stroke="#fff" stroke-width="30"/><path d="M50 330H1060M690 -30V650" stroke="#e0c9a0" stroke-width="3" stroke-dasharray="13 8"/><rect x="470" y="120" width="170" height="140" rx="16" fill="#dce8ce"/><circle cx="495" cy="148" r="12" fill="#abc396"/><circle cx="605" cy="228" r="15" fill="#b1c8a0"/><text x="555" y="202" text-anchor="middle" fill="#7d946c" font-size="17">세온 그린파크</text><text x="230" y="308" fill="#9c8d70" font-size="15">디자인로</text><text x="725" y="520" fill="#9c8d70" font-size="15">스튜디오길</text><g transform="translate(555 335)"><path d="M0 0C-65-60-38-108 0-108S65-60 0 0Z" fill="#ea5514"/><circle cx="0" cy="-70" r="16" fill="#fff"/><rect x="-110" y="10" width="220" height="60" rx="10" fill="#fff"/><text x="0" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#252525">SEON STUDIO</text><text x="0" y="56" text-anchor="middle" font-size="11" fill="#888">서울시 세온구 디자인로 24</text></g></g></svg><div class="caption">가상 위치 예시 · 실제 길찾기용 지도가 아닙니다.</div><div class="tools"><button aria-label="지도 확대" data-command="in">+</button><button aria-label="지도 축소" data-command="out">−</button><button aria-label="지도 초기화" data-command="reset">↺</button></div><script>let scale=1,x=0,y=0,drag=null;const world=document.querySelector('#world'),svg=document.querySelector('svg');function command(type){if(type==='in')scale=Math.min(3,scale+.2);if(type==='out')scale=Math.max(.7,scale-.2);if(type==='reset'){scale=1;x=y=0;}if(type==='skyview')document.body.style.filter='saturate(.7)';if(type==='roadmap')document.body.style.filter='';paint();}function paint(){world.setAttribute('transform',`translate(${550+x} ${300+y}) scale(${scale}) translate(-550 -300)`);}document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.seonMap)command(e.data.seonMap);});svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,oldX:x,oldY:y};svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(drag){x=drag.oldX+(e.clientX-drag.x)*1100/svg.clientWidth;y=drag.oldY+(e.clientY-drag.y)*600/svg.clientHeight;paint();}});svg.addEventListener('pointerup',()=>drag=null);</script></html>
