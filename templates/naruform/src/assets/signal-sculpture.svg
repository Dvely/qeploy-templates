<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
<title id="title">Folded color signal sculpture</title><desc id="desc">An original abstract sculpture of deep navy, coral, sky blue and butter yellow folded bands, arranged above a warm ivory surface.</desc>
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#35556c"/><stop offset=".45" stop-color="#172a3c"/><stop offset="1" stop-color="#091d30"/></linearGradient>
 <linearGradient id="coral" x1=".15" y1="0" x2=".75" y2="1"><stop stop-color="#ff9b76"/><stop offset=".43" stop-color="#fb704a"/><stop offset="1" stop-color="#ca4930"/></linearGradient>
 <linearGradient id="butter" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#f7fac2"/><stop offset=".48" stop-color="#e9ee93"/><stop offset="1" stop-color="#b7c371"/></linearGradient>
 <linearGradient id="sky" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#d9e9f0"/><stop offset=".45" stop-color="#accde3"/><stop offset="1" stop-color="#749fbc"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="floor"><stop stop-color="#172a3c" stop-opacity=".18"/><stop offset="1" stop-color="#172a3c" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="cast" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="7" dy="25" stdDeviation="20" flood-color="#233d4e" flood-opacity=".16"/></filter>
</defs>
<rect width="1400" height="1200" fill="#f4f2ec"/>
<ellipse cx="706" cy="1023" rx="491" ry="91" fill="url(#floor)"/>
<g filter="url(#cast)">
